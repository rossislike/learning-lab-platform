apiVersion: v1
kind: ServiceAccount
metadata:
  name: llp-dispatcher
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llp-dispatcher
  namespace: {{ .Values.sessionsNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llp-dispatcher
  namespace: {{ .Values.sessionsNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llp-dispatcher
subjects:
  - kind: ServiceAccount
    name: llp-dispatcher
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llp-dispatcher
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: llp-dispatcher
spec:
  replicas: {{ .Values.dispatcher.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llp-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llp-dispatcher
      annotations:
        checksum/secret: {{ include "learning-lab.secretChecksum" . }}
    spec:
      serviceAccountName: llp-dispatcher
      {{- include "learning-lab.nodeSelector" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dispatcher
          image: {{ .Values.images.platform }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [node, /app/runner/dispatcher/main.mjs]
          envFrom:
            - secretRef: { name: learning-lab-platform }
          env:
            - { name: SESSIONS_NAMESPACE, value: {{ .Values.sessionsNamespace | quote }} }
            - { name: SESSION_IMAGE, value: {{ .Values.images.session | quote }} }
            - { name: SESSION_IMAGE_PULL_POLICY, value: {{ .Values.images.pullPolicy | quote }} }
            - { name: BUNDLE_MODE, value: {{ .Values.bundle.mode | quote }} }
            - { name: BUNDLE_HOST_ROOT, value: {{ .Values.bundle.hostRoot | quote }} }
            {{- if eq .Values.bundle.mode "s3" }}
            - { name: BUNDLE_S3_BUCKET, value: {{ required "bundle.s3Bucket is required in s3 mode" .Values.bundle.s3Bucket | quote }} }
            - { name: AWS_REGION, value: {{ required "bundle.region is required in s3 mode" .Values.bundle.region | quote }} }
            {{- if .Values.bundle.initImage }}
            - { name: BUNDLE_INIT_IMAGE, value: {{ .Values.bundle.initImage | quote }} }
            {{- end }}
            {{- end }}
            - { name: GATEWAY_HOST_SUFFIX, value: {{ .Values.gateway.hostSuffix | quote }} }
            - { name: GATEWAY_PUBLIC_SCHEME, value: {{ .Values.gateway.publicScheme | quote }} }
            - { name: GATEWAY_PUBLIC_PORT, value: {{ .Values.gateway.publicPort | quote }} }
            - { name: DISPATCHER_POLL_MS, value: {{ .Values.dispatcher.pollMs | quote }} }
            - { name: DISPATCHER_STARTUP_TIMEOUT_MS, value: {{ .Values.dispatcher.startupTimeoutMs | quote }} }
            - { name: KUBERNETES_MODE, value: in-cluster }
            {{- if .Values.nodeArch }}
            - { name: SESSION_NODE_ARCH, value: {{ .Values.nodeArch | quote }} }
            {{- end }}
            {{- if .Values.dispatcher.metricsNamespace }}
            - { name: METRICS_NAMESPACE, value: {{ .Values.dispatcher.metricsNamespace | quote }} }
            - { name: METRICS_ENVIRONMENT, value: {{ required "dispatcher.metricsEnvironment is required when dispatcher.metricsNamespace is set" .Values.dispatcher.metricsEnvironment | quote }} }
            {{- if ne .Values.bundle.mode "s3" }}
            - { name: AWS_REGION, value: {{ required "bundle.region (AWS_REGION) is required for metrics" .Values.bundle.region | quote }} }
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
