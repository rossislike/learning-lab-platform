apiVersion: v1
kind: Secret
metadata:
  name: learning-lab-platform
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONVEX_URL: {{ required "convexUrl is required (--set convexUrl=https://....convex.cloud)" .Values.convexUrl | quote }}
  RUNNER_SHARED_SECRET: {{ required "runnerSecret is required (--set runnerSecret=...)" .Values.runnerSecret | quote }}
