{{- if .Values.reaper.enabled }}
# TTL safety net (runner/dispatcher/reaper.mjs): deletes session pods past
# their expiry annotation or left in Failed/Succeeded, independently of
# Convex and the dispatcher. Its own service account and Role: it only reads
# and deletes session pods (never creates them).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llp-reaper
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llp-reaper
  namespace: {{ .Values.sessionsNamespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llp-reaper
  namespace: {{ .Values.sessionsNamespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llp-reaper
subjects:
  - kind: ServiceAccount
    name: llp-reaper
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llp-reaper
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: llp-reaper
spec:
  schedule: {{ .Values.reaper.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    metadata:
      labels:
        {{- include "learning-lab.labels" . | nindent 8 }}
        app.kubernetes.io/name: llp-reaper
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: llp-reaper
        spec:
          serviceAccountName: llp-reaper
          restartPolicy: Never
          {{- include "learning-lab.nodeSelector" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: reaper
              image: {{ .Values.images.platform }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: [node, /app/runner/dispatcher/reaper.mjs]
              env:
                - { name: SESSIONS_NAMESPACE, value: {{ .Values.sessionsNamespace | quote }} }
                - { name: KUBERNETES_MODE, value: in-cluster }
                - { name: EXPIRED_GRACE_SECONDS, value: {{ .Values.reaper.expiredGraceSeconds | quote }} }
                - { name: FINISHED_GRACE_SECONDS, value: {{ .Values.reaper.finishedGraceSeconds | quote }} }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
{{- end }}
